name: Bootstrap project tree
on:
  push:
    branches: [feature/news-video-pipeline]
    paths:
      - '.bootstrap/project.tar.xz.b64'
      - '.github/workflows/bootstrap-project.yml'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand tested project snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap/project.tar.xz.b64 ]; then
            echo "Archive not present yet; waiting for the archive push."
            exit 0
          fi
          base64 -d .bootstrap/project.tar.xz.b64 > /tmp/autonewsroller.tar.xz
          tar -xJf /tmp/autonewsroller.tar.xz -C .
          rm -f .bootstrap/project.tar.xz.b64
          rmdir .bootstrap 2>/dev/null || true
          rm -f .github/workflows/bootstrap-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi
          git commit -m "Implement AutoNewsRoller news video pipeline"
          git push origin HEAD:feature/news-video-pipeline

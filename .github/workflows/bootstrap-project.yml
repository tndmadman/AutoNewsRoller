name: Bootstrap project tree
on:
  push:
    branches: [feature/news-video-pipeline]
    paths:
      - '.bootstrap/project.tar.xz.b64.part*'
      - '.github/workflows/bootstrap-project.yml'
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand tested project snapshot
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.bootstrap/project.tar.xz.b64.part*)
          if [ "${#parts[@]}" -ne 8 ]; then
            echo "Expected 8 snapshot chunks, found ${#parts[@]}."
            exit 1
          fi
          cat "${parts[@]}" | base64 -d > /tmp/autonewsroller.tar.xz
          echo "b8694c57647c79e19ac33e14287115b91328872050e7a04600063679ea36e89b  /tmp/autonewsroller.tar.xz" | sha256sum -c -
          tar -xJf /tmp/autonewsroller.tar.xz -C .
          rm -f .bootstrap/project.tar.xz.b64.part*
          rmdir .bootstrap 2>/dev/null || true
          rm -f .github/workflows/bootstrap-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi
          git commit -m "Implement AutoNewsRoller news video pipeline"
          git push origin HEAD:feature/news-video-pipeline

name: Cross-platform validation
on:
  push:
    branches: [main, feature/news-video-pipeline, feature/political-framing-exposure-video, feature/rss-meme-ragebait-pipeline]
  pull_request:
    branches: [main]

jobs:
  windows-self-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Self test
        shell: cmd
        run: |
          batch_create_news_videos_windows.bat --self-test
          java -cp build/classes autonewsroller.commandcenter.WorkerConsoleSelfTest
      - name: Windows worker web launcher smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/runtime | Out-Null
          '{"port":8788,"autoStart":false,"autoOpenBrowser":false}' | Set-Content -Path output/runtime/worker-ui-settings.json -Encoding utf8
          $out = Join-Path $env:RUNNER_TEMP 'worker-ui-out.log'
          $err = Join-Path $env:RUNNER_TEMP 'worker-ui-err.log'
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c run_gpu_worker_ui_windows.bat http://127.0.0.1:8787 WIN-CI-WORKER' -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $ready = $false
            for ($i=0; $i -lt 60; $i++) {
              try {
                $r = Invoke-RestMethod -Uri 'http://127.0.0.1:8788/api/worker/health' -TimeoutSec 2
                if ($r.ok) { $ready = $true; break }
              } catch {}
              if ($p.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Worker UI launcher did not start on port 8788' }
            $state = Invoke-RestMethod -Uri 'http://127.0.0.1:8788/api/worker/status' -TimeoutSec 3
            if ($state.worker.lifecycle -ne 'STOPPED') { throw 'Worker should remain stopped when autoStart=false' }
            Write-Host 'Windows UI batch launcher and localhost health/status smoke PASS'
          } finally {
            if (-not $p.HasExited) { & taskkill /PID $p.Id /T /F | Out-Null }
            if (Test-Path $out) { Get-Content $out -Tail 35 }
            if (Test-Path $err) { Get-Content $err -Tail 35 }
          }
      - name: FFmpeg for Windows motion/caption validation
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Windows FFmpeg smoke render
        shell: cmd
        run: |
          ffmpeg -version
          java -cp build/classes autonewsroller.video.VisualSmoke
          java -cp build/classes autonewsroller.video.PoliticalFramingSmoke
          java -cp build/classes autonewsroller.video.MemeSmoke

  linux-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dashboard JavaScript syntax
        run: |
          node --check web/command-center/app.js
          node --check web/worker-console/app.js
      - name: Compile and self-test
        shell: bash
        run: |
          bash -n build_linux.sh
          bash -n run_command_center_linux.sh
          bash -n run_gpu_worker_linux.sh
          bash build_linux.sh
          java -cp build/classes autonewsroller.Main --self-test
          java -cp build/classes autonewsroller.commandcenter.WorkerConsoleSelfTest
          java -cp build/classes autonewsroller.Main --dry-run --fixture --batch-target 1 --workers 2 --max-age-hours 24 --minimum-independent-sources 2 --duration 60 --encoder x264
      - name: V5 FFmpeg render and actual MP4 contact sheet
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          V5_LONG_SMOKE=true java -cp build/classes autonewsroller.video.VisualSmoke
          java -cp build/classes autonewsroller.video.PoliticalFramingSmoke
          java -cp build/classes autonewsroller.video.MemeSmoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-visual-smoke
          path: test-results/v5/
          if-no-files-found: ignore
      - name: Headless command center smoke test
        shell: bash
        run: |
          java -cp build/classes autonewsroller.Main --command-center --host 127.0.0.1 --port 18787 --scan-minutes 60 --no-initial-scan > command-center-smoke.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18787/api/health > /tmp/health.json; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:18787/api/state > /tmp/state.json
          curl --fail --silent http://127.0.0.1:18787/ | grep -q "AUTONEWSROLLER"
          grep -q '"ok":true' /tmp/health.json

  dashboard-browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Test selection stability, click handling and video version identity
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-center-retro-screenshots
          path: test-results/terminal-screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-console-responsive-screenshots
          path: test-results/worker-console-screenshots/
          if-no-files-found: ignore
